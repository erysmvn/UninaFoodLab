name: Build and Analyze

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest  # Meglio Ubuntu di MacOS (più veloce ed economico)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Installa Java (necessario per compilare)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      # 2. Compila i file Java "sciolti"
      - name: Compile Java Files
        run: |
          mkdir bin
          find . -name "*.java" > sources.txt
          javac -d bin @sources.txt
          # Se questo comando fallisce, significa che il tuo codice ha errori di sintassi

      # 3. Lancia SonarQube specificando dove sono i binari
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4 # Usa la versione v4 che è più stabile per SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=LA_TUA_PROJECT_KEY
            -Dsonar.organization=LA_TUA_ORG_KEY
            -Dsonar.sources=.
            -Dsonar.java.binaries=bin

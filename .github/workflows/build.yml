name: Build and Analyze

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones disabilitati

      # 1. Installa Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      # 2. Compila i file Java nella cartella 'bin'
      - name: Compile Java Files
        run: |
          mkdir -p bin
          find . -name "*.java" > sources.txt
          if [ -s sources.txt ]; then
            javac -d bin @sources.txt
          else
            echo "Nessun file Java trovato!"
            exit 1
          fi

      # 3. Esegue la scansione usando l'azione specifica per SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Necessario
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Il secret che hai creato
        with:
          args: >
            -Dsonar.organization=INSERISCI_QUI_ORG_KEY
            -Dsonar.projectKey=INSERISCI_QUI_PROJECT_KEY
            -Dsonar.sources=.
            -Dsonar.java.binaries=bin
            -Dsonar.host.url=https://sonarcloud.io
